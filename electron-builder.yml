appId: com.luke.youtubeaudioripper
productName: YouTube Audio Ripper
directories:
  output: release
files:
  - src/**/*
  - package.json
extraResources:
  - from: bin
    to: bin
    filter:
      - '**/*'
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
